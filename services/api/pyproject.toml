[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "arq>=0.28.0",
    "fastapi>=0.137.2",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.10.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.49.0",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "alembic>=1.18.4",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.15.18",
    "xlwt>=1.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
