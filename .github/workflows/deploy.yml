name: Deploy

# Pulls the freshly built images on the application host, restarts the
# affected services, then runs migrations (Better Auth CLI for its tables,
# Alembic for app tables — both idempotent). See ARCHITECTURE.md §13.
#
# Requires repo/environment secrets: SSH_HOST, SSH_USER, SSH_KEY.

on:
  workflow_run:
    workflows: ["Build images"]
    types: [completed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Deploy ONLY after a successful build of `main` — no manual path.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'main' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/expense-tracker
            git pull --ff-only
            docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml pull
            docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d
            docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml exec -T auth bun run schema:migrate
            docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml exec -T api uv run alembic upgrade head
